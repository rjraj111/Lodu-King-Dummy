<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Utility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --border-color: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;

      --color-red: #E52521;
      --color-green: #009E49;
      --color-yellow: #FFC20E;
      --color-blue: #0072CE;
      --gold: #FFD700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .controller-view, .calculator-view {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calculator-view {
      display: none;
      height: 94vh;
      justify-content: flex-end;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .conn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .conn-dot.online {
      background: #22C55E;
      box-shadow: 0 0 8px #22C55E;
    }

    .room-tag {
      font-family: monospace;
      font-weight: 700;
      font-size: 0.9rem;
      background: #0F172A;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .disguise-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #FFF;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Live Game State Card */
    .live-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Section Cards */
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Winner Selector Grid */
    .winner-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .winner-btn {
      padding: 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, filter 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .winner-btn:active {
      transform: scale(0.96);
    }

    .btn-red    { background: var(--color-red); }
    .btn-green  { background: var(--color-green); }
    .btn-yellow { background: var(--color-yellow); color: #000; }
    .btn-blue   { background: var(--color-blue); }
    .btn-fair   { background: #475569; grid-column: 1 / -1; }

    .winner-btn.selected {
      border-color: #FFF;
      box-shadow: 0 0 16px var(--gold);
      transform: scale(1.02);
    }

    /* Dice Override Grid */
    .dice-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .force-dice-btn {
      background: #0F172A;
      border: 1.5px solid var(--border-color);
      color: #FFF;
      padding: 14px 0;
      border-radius: 12px;
      font-family: 'Lilita One', cursive;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .force-dice-btn:active {
      transform: scale(0.92);
      background: var(--gold);
      color: #000;
    }

    .force-dice-btn.active-forced {
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.2);
      color: var(--gold);
    }

    /* Auto Kill Button */
    .sniper-btn {
      background: linear-gradient(135deg, #7C3AED 0%, #C026D3 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #FFF;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(192, 38, 211, 0.4);
      transition: transform 0.15s ease;
    }

    .sniper-btn:active {
      transform: scale(0.97);
    }

    .sniper-btn.active-kill {
      background: linear-gradient(135deg, #DC2626 0%, #EA580C 100%);
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.7);
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #000;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ============================================================
       DISGUISED CALCULATOR APP
       ============================================================ */
    .calc-screen {
      background: transparent;
      color: #FFF;
      font-size: 3.8rem;
      text-align: right;
      padding: 10px 14px;
      font-weight: 300;
      overflow-x: auto;
      white-space: nowrap;
      cursor: pointer;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .calc-btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      font-size: 1.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFF;
      background: #333333;
      transition: filter 0.1s ease;
    }

    .calc-btn:active {
      filter: brightness(1.3);
    }

    .calc-btn.btn-fn {
      background: #A5A5A5;
      color: #000;
    }

    .calc-btn.btn-op {
      background: #FF9F0A;
      color: #FFF;
    }

    .calc-btn.btn-zero {
      grid-column: 1 / 3;
      aspect-ratio: auto;
      border-radius: 40px;
      justify-content: flex-start;
      padding-left: 28px;
    }
  </style>
</head>
<body>

  <!-- MAIN CONTROLLER VIEW -->
  <main class="controller-view" id="controllerView">
    <!-- Header -->
    <header class="header-bar">
      <div class="status-group">
        <div class="conn-dot" id="connDot" title="Connection status"></div>
        <span class="room-tag" id="roomCodeDisplay" title="Click to change room">ROOM: LK1001</span>
      </div>
      <button class="disguise-btn" id="disguiseBtn">
        <span>🧮</span> Disguise
      </button>
    </header>

    <!-- Live Status Monitor -->
    <div class="live-card">
      <div class="stat-box">
        <span class="stat-label">Active Turn</span>
        <span class="stat-value" id="turnDisplay">Waiting...</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Last Dice Roll</span>
        <span class="stat-value" id="rollDisplay">--</span>
      </div>
      <div class="stat-box" style="grid-column: 1 / -1;">
        <span class="stat-label">Guaranteed Favored Winner</span>
        <span class="stat-value" id="favoredDisplay" style="color: var(--gold);">FAIR MODE</span>
      </div>
    </div>

    <!-- Favored Winner Selector -->
    <section class="control-card">
      <div class="section-title">
        <span>Set Guaranteed Winner</span>
        <span style="font-size: 0.72rem; color: #22C55E;">Stealth Auto-Bias</span>
      </div>
      <div class="winner-grid">
        <button class="winner-btn btn-red" data-winner="red">🔴 RED</button>
        <button class="winner-btn btn-green" data-winner="green">🟢 GREEN</button>
        <button class="winner-btn btn-yellow" data-winner="yellow">🟡 YELLOW</button>
        <button class="winner-btn btn-blue" data-winner="blue">🔵 BLUE</button>
        <button class="winner-btn btn-fair selected" data-winner="fair">⚪ FAIR MODE (OFF)</button>
      </div>
    </section>

    <!-- Instant Dice Override -->
    <section class="control-card">
      <div class="section-title">
        <span>Force Next Dice Roll</span>
        <span id="forceStatus" style="font-size: 0.72rem; color: var(--gold);">Instant</span>
      </div>
      <div class="dice-grid">
        <button class="force-dice-btn" data-val="1">1</button>
        <button class="force-dice-btn" data-val="2">2</button>
        <button class="force-dice-btn" data-val="3">3</button>
        <button class="force-dice-btn" data-val="4">4</button>
        <button class="force-dice-btn" data-val="5">5</button>
        <button class="force-dice-btn" data-val="6">6</button>
      </div>
    </section>

    <!-- Auto-Kill Sniper Trigger -->
    <section class="control-card">
      <button class="sniper-btn" id="autoKillBtn">
        <span>🎯</span> FORCE AUTO-KILL DISTANCE
      </button>
    </section>
  </main>

  <!-- DISGUISED CALCULATOR VIEW -->
  <div class="calculator-view" id="calculatorView">
    <div class="calc-screen" id="calcDisplay" title="Tap 3 times to exit disguise">0</div>
    <div class="calc-grid">
      <button class="calc-btn btn-fn" id="calcAcBtn">AC</button>
      <button class="calc-btn btn-fn">+/-</button>
      <button class="calc-btn btn-fn">%</button>
      <button class="calc-btn btn-op">÷</button>

      <button class="calc-btn">7</button>
      <button class="calc-btn">8</button>
      <button class="calc-btn">9</button>
      <button class="calc-btn btn-op">×</button>

      <button class="calc-btn">4</button>
      <button class="calc-btn">5</button>
      <button class="calc-btn">6</button>
      <button class="calc-btn btn-op">-</button>

      <button class="calc-btn">1</button>
      <button class="calc-btn">2</button>
      <button class="calc-btn">3</button>
      <button class="calc-btn btn-op">+</button>

      <button class="calc-btn btn-zero">0</button>
      <button class="calc-btn">.</button>
      <button class="calc-btn btn-op">=</button>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg">Command Sent</div>

  <!-- MQTT library for WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="js/sync.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const syncManager = new SyncManager(true);
      const connDot = document.getElementById('connDot');
      const roomCodeDisplay = document.getElementById('roomCodeDisplay');
      const turnDisplay = document.getElementById('turnDisplay');
      const rollDisplay = document.getElementById('rollDisplay');
      const favoredDisplay = document.getElementById('favoredDisplay');
      const forceStatus = document.getElementById('forceStatus');
      const autoKillBtn = document.getElementById('autoKillBtn');
      const toastMsg = document.getElementById('toastMsg');

      const controllerView = document.getElementById('controllerView');
      const calculatorView = document.getElementById('calculatorView');
      const disguiseBtn = document.getElementById('disguiseBtn');
      const calcDisplay = document.getElementById('calcDisplay');
      const calcAcBtn = document.getElementById('calcAcBtn');

      roomCodeDisplay.textContent = `ROOM: ${syncManager.getRoomId()}`;

      // Change Room code on tap
      roomCodeDisplay.addEventListener('click', () => {
        const input = prompt('Enter Room Code (e.g. LK1234):', syncManager.getRoomId());
        if (input) {
          syncManager.setRoomId(input.trim());
          roomCodeDisplay.textContent = `ROOM: ${syncManager.getRoomId()}`;
        }
      });

      // Connect
      syncManager.onConnectionChange = (online) => {
        if (online) {
          connDot.classList.add('online');
        } else {
          connDot.classList.remove('online');
        }
      };

      syncManager.connect();

      // State update from main game board
      syncManager.onStateUpdate = (state) => {
        if (!state) return;
        connDot.classList.add('online');

        // Turn indicator
        const turnColor = state.currentTurn;
        const colorEmojis = { red: '🔴', green: '🟢', yellow: '🟡', blue: '🔵' };
        turnDisplay.textContent = `${colorEmojis[turnColor] || ''} ${turnColor.toUpperCase()}`;

        // Roll indicator
        rollDisplay.textContent = state.lastDiceRoll ? `🎲 ${state.lastDiceRoll}` : '--';

        // Favored indicator
        const favored = state.favoredPlayer;
        if (favored) {
          favoredDisplay.textContent = `${colorEmojis[favored] || ''} ${favored.toUpperCase()} (BIASED)`;
          favoredDisplay.style.color = 'var(--gold)';
        } else {
          favoredDisplay.textContent = '⚪ FAIR MODE';
          favoredDisplay.style.color = '#CBD5E1';
        }

        // Highlight selected winner button
        document.querySelectorAll('.winner-btn').forEach(btn => {
          const val = btn.dataset.winner;
          if ((!favored && val === 'fair') || (favored === val)) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      };

      // Winner Selection
      document.querySelectorAll('.winner-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          vibrate();
          const target = btn.dataset.winner;
          const favored = target === 'fair' ? null : target;
          syncManager.sendControlCommand({ action: 'SET_WINNER', player: favored });
          showToast(`Favored Winner: ${target.toUpperCase()}`);

          document.querySelectorAll('.winner-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });

      // Force Dice Roll Buttons
      document.querySelectorAll('.force-dice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          vibrate();
          const val = parseInt(btn.dataset.val, 10);
          syncManager.sendControlCommand({ action: 'FORCE_DICE', value: val });
          showToast(`Queued Next Roll: ${val}`);

          document.querySelectorAll('.force-dice-btn').forEach(b => b.classList.remove('active-forced'));
          btn.classList.add('active-forced');
          setTimeout(() => btn.classList.remove('active-forced'), 1500);
        });
      });

      // Auto-Kill Trigger
      autoKillBtn.addEventListener('click', () => {
        vibrate();
        syncManager.sendControlCommand({ action: 'AUTO_KILL' });
        showToast('🎯 Auto-Kill Locked for Next Roll!');
        autoKillBtn.classList.add('active-kill');
        setTimeout(() => autoKillBtn.classList.remove('active-kill'), 2000);
      });

      function vibrate() {
        if (navigator.vibrate) navigator.vibrate(25);
      }

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 1600);
      }

      /* ============================================================
         DISGUISED CALCULATOR LOGIC
         ============================================================ */
      disguiseBtn.addEventListener('click', () => {
        controllerView.style.display = 'none';
        calculatorView.style.display = 'flex';
      });

      // Secret exit: Tap calculator display 3 times quickly
      let screenTapCount = 0;
      let lastScreenTapTime = 0;
      calcDisplay.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastScreenTapTime < 800) {
          screenTapCount++;
        } else {
          screenTapCount = 1;
        }
        lastScreenTapTime = now;

        if (screenTapCount >= 3) {
          calculatorView.style.display = 'none';
          controllerView.style.display = 'flex';
          screenTapCount = 0;
        }
      });

      // Real working calculator engine
      let currentInput = '0';
      let prevInput = null;
      let operator = null;
      let resetOnNextDigit = false;

      function updateCalcScreen() {
        calcDisplay.textContent = currentInput;
      }

      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.textContent.trim();

          if (!isNaN(text) || text === '.') {
            if (resetOnNextDigit || currentInput === '0') {
              currentInput = (text === '.') ? '0.' : text;
              resetOnNextDigit = false;
            } else {
              if (text === '.' && currentInput.includes('.')) return;
              if (currentInput.length < 10) currentInput += text;
            }
          } else if (text === 'AC') {
            currentInput = '0';
            prevInput = null;
            operator = null;
          } else if (text === '+/-') {
            currentInput = (parseFloat(currentInput) * -1).toString();
          } else if (text === '%') {
            currentInput = (parseFloat(currentInput) / 100).toString();
          } else if (['+', '-', '×', '÷'].includes(text)) {
            prevInput = parseFloat(currentInput);
            operator = text;
            resetOnNextDigit = true;
          } else if (text === '=') {
            if (operator && prevInput !== null) {
              const current = parseFloat(currentInput);
              let res = 0;
              if (operator === '+') res = prevInput + current;
              if (operator === '-') res = prevInput - current;
              if (operator === '×') res = prevInput * current;
              if (operator === '÷') res = current !== 0 ? prevInput / current : 0;
              currentInput = (Math.round(res * 1000000) / 1000000).toString();
              operator = null;
              prevInput = null;
              resetOnNextDigit = true;
            }
          }
          updateCalcScreen();
        });
      });
    });
  </script>
</body>
</html>
