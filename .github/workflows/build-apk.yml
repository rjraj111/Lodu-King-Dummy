name: Build Ludo King APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build APK
        run: |
          bubblewrap init --manifest=./manifest.json --directory=android-project --skipPwaValidation || true
          cd android-project || exit 0
          bubblewrap build --skipSigning || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-King-v1.2.0-APK
          path: '**/*.apk'
          if-no-files-found: warn
