name: Build Android APK (TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ludo King Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: |
          sudo npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Bubblewrap configuration created with JDK: $JAVA_HOME and SDK: $ANDROID_HOME"

      - name: Generate TWA Android Project
        run: |
          LIVE_URL="https://rjraj111.github.io/Lodu-King-Dummy"
          MANIFEST_URL="${LIVE_URL}/manifest.json"

          # Start background server for local fallback if remote is not yet published
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2

          TARGET_MANIFEST="http://localhost:8080/manifest.json"
          if curl -s -f "$MANIFEST_URL" > /dev/null; then
            echo "Remote live URL is active. Using: $MANIFEST_URL"
            TARGET_MANIFEST="$MANIFEST_URL"
          else
            echo "Using local server manifest URL: $TARGET_MANIFEST"
          fi

          mkdir -p twa-project
          cd twa-project

          # Create twa-manifest.json with user specifications
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.game.ludoking",
            "host": "rjraj111.github.io",
            "name": "Ludo King",
            "launcherName": "Ludo King",
            "display": "standalone",
            "themeColor": "#001a4d",
            "navigationColor": "#001a4d",
            "navigationColorDark": "#001a4d",
            "navigationDividerColor": "#001a4d",
            "navigationDividerColorDark": "#001a4d",
            "backgroundColor": "#001a4d",
            "enableNotifications": true,
            "startUrl": "/Lodu-King-Dummy/index.html",
            "iconUrl": "http://localhost:8080/assets/images/icon-512.png",
            "maskableIconUrl": "http://localhost:8080/assets/images/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "$TARGET_MANIFEST",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://rjraj111.github.io/Lodu-King-Dummy/",
            "orientation": "portrait"
          }
          EOF

          # Run bubblewrap update to generate all Android gradle files
          bubblewrap update --skipVersionUpgrade || true

          # If update needs init fallback, initialize with piped defaults
          if [ ! -f "build.gradle" ] && [ ! -f "gradlew" ]; then
            printf "\n\n\ncom.game.ludoking\nLudo King\nLudo King\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest="$TARGET_MANIFEST" || true
          fi

          kill $SERVER_PID || true
          echo "TWA Android Project generated successfully."

      - name: Build APK using Gradle
        run: |
          mkdir -p dist-apk

          # Build TWA APK if twa-project gradle wrapper is present
          if [ -d "twa-project" ] && [ -f "twa-project/gradlew" ]; then
            cd twa-project
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace || ./gradlew assembleRelease --stacktrace || true
            cd ..
            find twa-project -name "*.apk" -exec cp {} dist-apk/ \; 2>/dev/null || true
          fi

          # Also build repo native project APK
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace || true
            find app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/ \; 2>/dev/null || true
          fi

          echo "Collected APK files in dist-apk:"
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-King-APK
          path: dist-apk/*.apk
          if-no-files-found: error
